spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

spring.grpc.client.channel.pedidos.target=${PEDIDO_GRPC_TARGET:static://localhost:9090}
spring.grpc.client.channel.estoque.target=${ESTOQUE_GRPC_TARGET:static://localhost:9091}

app.grpc.deadline=${GRPC_DEADLINE:5s}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.auth.username=${APP_USERNAME:admin}
app.auth.password=${APP_PASSWORD:admin}
app.jwt.secret=${JWT_SECRET:segredo-didatico-exclusivo-do-laboratorio-com-mais-de-32-bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
