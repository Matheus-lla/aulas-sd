spring.application.name=pedido-service
# Sem perfil explícito, a demonstração usa H2. Na nuvem, selecione cloud.
spring.profiles.default=local
spring.main.web-application-type=none
spring.grpc.server.port=${GRPC_PORT:9090}
spring.grpc.client.channel.estoque.target=${ESTOQUE_GRPC_TARGET:static://localhost:9091}

# A conexão está nos arquivos de perfil: local (H2) e cloud (PostgreSQL).
# Cada processo acessa apenas seu próprio banco, utilizando o padrão JPA das aulas.
spring.jpa.hibernate.ddl-auto=update
# Se uma tabela antiga for incompatível, interrompe a inicialização antes de atender gRPC.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
