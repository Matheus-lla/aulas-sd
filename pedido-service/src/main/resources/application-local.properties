# Perfil opcional sem servidor externo; o arquivo persiste após reiniciar o serviço.
spring.datasource.url=${LOCAL_DB_URL:jdbc:h2:file:./data/pedidos_demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
