syntax = "proto3";

package estoque;

option java_multiple_files = true;
option java_package = "aula.sd.ecommerce.grpc";

service EstoqueService {
  rpc ConsultarEstoque(ConsultarEstoqueRequest) returns (ConsultarEstoqueResponse);
}

message ConsultarEstoqueRequest {
  string item = 1;
}

message ConsultarEstoqueResponse {
  int32 quantidade_disponivel = 1;
}
